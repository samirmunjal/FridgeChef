openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
    description: Ingredient detection and recipe matching
paths:
  /recipes/detect-ingredients:
    post:
      operationId: detectIngredients
      tags: [recipes]
      summary: Detect ingredients from a fridge/pantry photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientDetectionInput"
      responses:
        "200":
          description: Detected ingredients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientDetectionResult"
  /recipes/suggest:
    post:
      operationId: suggestRecipes
      tags: [recipes]
      summary: Suggest recipes matching ingredients and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeSuggestionInput"
      responses:
        "200":
          description: Suggested recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSuggestionResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IngredientDetectionInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded JPEG/PNG image data (no data URL prefix)
        apiKey:
          type: string
          description: User-provided Gemini API key (used only for photo ingredient detection). Recipe suggestions use Spoonacular and do not require this key.
    IngredientDetectionResult:
      type: object
      required:
        - ingredients
      properties:
        ingredients:
          type: array
          items:
            type: string
    RecipeSuggestionInput:
      type: object
      required:
        - ingredients
        - cuisines
        - diets
      properties:
        ingredients:
          type: array
          items:
            type: string
        cuisines:
          type: array
          items:
            type: string
        diets:
          type: array
          items:
            type: string
        apiKey:
          type: string
          description: User-provided Gemini API key (used only for photo ingredient detection). Recipe suggestions use Spoonacular and do not require this key.
    Recipe:
      type: object
      required:
        - id
        - title
        - time
        - difficulty
        - matchPercent
        - missingIngredients
        - cuisine
        - description
        - ingredients
        - steps
      properties:
        id:
          type: string
        title:
          type: string
        time:
          type: string
        difficulty:
          type: string
        matchPercent:
          type: integer
        missingIngredients:
          type: array
          items:
            type: string
        cuisine:
          type: string
        description:
          type: string
        ingredients:
          type: array
          items:
            type: string
          description: Full list of ingredients needed for this recipe (including what the user already has).
        steps:
          type: array
          items:
            type: string
          description: Step-by-step cooking instructions.
        imageBase64:
          type: string
          description: Optional AI-generated food photo as base64 JPEG.
        imageUrl:
          type: string
          description: Optional URL to a food photo for this recipe.
    RecipeSuggestionResult:
      type: object
      required:
        - recipes
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"

